<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#1bd96a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="11"/>
  <circle cx="12" cy="12" r="8"/>
  <!-- handle: bottom-left to top-right, slope -1 -->
  <line x1="4.6" y1="19.5" x2="11" y2="13"/>
  <!-- head base: top-left to bottom-right, slope +1 -->
  <line x1="9" y1="11" x2="13" y2="15"/>
  <!-- prong 1: from base top-left end, slope -1 -->
  <line x1="9" y1="11" x2="12" y2="8"/>
  <!-- prong 2: from base bottom-right end, slope -1 -->
  <line x1="13" y1="15" x2="16" y2="12"/>
</svg>
